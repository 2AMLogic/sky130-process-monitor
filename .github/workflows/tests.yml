name: unit tests

# The same gate agents run locally before a PR: `npm test` from package.json.
# CI runs the npm script itself rather than re-listing the test files, so the
# local gate and this job cannot drift apart (issue #127).
#
# Stdlib-only `unittest`, no simulator and no PDK: sim/sensitivity/test_analyze.py
# (sensitivity matrix + conditioning), sim/power/test_analyze_power.py (the row-7
# power grader admits exactly the active cells the #8 frequency surface resolves,
# issue #173), sim/solve/test_gen_binding_mc.py (sized
# MC request drift), sim/solve/test_solve.py (synthetic negative controls for
# the row 1-4 solve), sim/pex/test_gen_requests.py (the pex benches still
# equal what sim/pex/gen_requests.py derives from the #29 sensitivity benches,
# issue #137) and sim/solve/test_records_reproduce.py (each committed sim/solve
# output still regenerates byte-identically from the explicit input report list
# pinned in its record, issue #140). The sized-request drift check also runs
# standalone in .github/workflows/drift.yml, which owns that `sized-requests`
# status check.
#
# Python 3.12, not 3.10: sim/solve/records/2026-11-05-rows1-4.json writes
# mc_pooled_sigma_lnf at full float repr and was produced on 3.12, whose sum()
# of floats is compensated (gh-100425). On 3.10/3.11 two of those sigmas come
# out 1 ULP different, so the byte-identity check cannot run there and the
# record must not be regenerated to suit an older interpreter (issue #140).
# test_records_reproduce.py asserts this version floor against this file.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: npm test (sensitivity, power gradability, sized-request drift, solve negative controls, pex bench derivation, record reproduction)
        run: npm test
