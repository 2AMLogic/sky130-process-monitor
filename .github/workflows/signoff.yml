name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest
# (manifests/sky130-process-monitor.json) and byte-compare the fresh output
# against the committed verdict-of-record
# (manifests/sky130-process-monitor.signoff.json).
#
# See manifests/README.md for the convention and how to regenerate.
#
# Python 3.12 is the repo-wide floor, not a requirement of this job: the
# grader's output is byte-identical under 3.10 and 3.12 and the committed
# verdict holds on both (measured, issue #144). The floor is declared once, by
# `min_python` in sim/solve/test_records_reproduce.py, and every workflow
# follows it so the next full-repr float produced by sum() does not have to
# rediscover the 3.10-vs-3.12 split (gh-100425) in hash-bound evidence. The
# same test fails if any workflow is lowered below it.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned klt
        run: pip install klayout-tools==0.9.1

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-process-monitor.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at
          # least one item is unmet. Both are valid runs. Anything else is
          # a hard error (manifest/doc unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-process-monitor.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/sky130-process-monitor.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/sky130-process-monitor.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/sky130-process-monitor.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-process-monitor.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh: it matches a fresh klt signoff run."
          python3 -c "import json; d=json.load(open('manifests/sky130-process-monitor.signoff.json')); print('tier verdict of record:', d['tier'], '(T1 items met: %d/%d)' % (d['t1_met_count'], d['t1_item_count']))"

      - name: Re-attest T1 item 10 and compare against the committed envelope
        run: |
          klt signoff --attest 10 --inventory attest/item10.json \
                      --check evidence/item10.json

      # The freshness commands in these inventories need the pinned PDK, xschem
      # and Yosys, which this runner lacks: they are marked local_only, so
      # --check re-hashes the inventory inputs and carries the committed
      # outcome of those commands. Re-run them locally (see manifests/README.md).
      - name: Re-attest T1 item 1 (analog, digital) and compare against the committed envelopes
        run: |
          klt signoff --attest 1 --inventory attest/item1_analog.json \
                      --check evidence/item1_analog.json
          klt signoff --attest 1 --inventory attest/item1_digital.json \
                      --check evidence/item1_digital.json

      # Every item-9 cold start is local_only (the pinned PDK, ngspice, Icarus,
      # Verilator and cocotb, none of which this runner has): --check re-hashes
      # every inventoried testbench and request and carries the committed
      # outcome of the commands. Re-run them locally (see manifests/README.md,
      # "Item 9 (testbenches shipped)").
      - name: Re-attest T1 item 9 (analog, digital) and compare against the committed envelopes
        run: |
          klt signoff --attest 9 --inventory attest/item9_analog.json \
                      --check evidence/item9_analog.json
          klt signoff --attest 9 --inventory attest/item9_digital.json \
                      --check evidence/item9_digital.json

      # Both partitions' declared freshness commands need a toolchain this
      # runner lacks (digital: OpenROAD and the pinned PDK; analog: the pinned
      # klayout==0.30.10 of layout/gen/requirements.txt and the sky130A PDK),
      # so they are marked local_only: --check re-hashes the stream and the
      # inventory, re-runs klt's own three stream checks, re-compares the
      # recorded regeneration claim, and carries the committed outcome of the
      # commands. Re-run them locally (see layout/README.md).
      #
      # The analog --generator/--regenerated-hash flags are load-bearing, not
      # decoration: provenance.regeneration is part of what --check compares,
      # so dropping them or changing the hash reports `drifted` (exit 3).
      - name: Re-attest T1 item 2 (analog, digital) and compare against the committed envelopes
        run: |
          klt signoff --attest 2 --input layout/osc_bank.gds \
                      --inventory attest/item2_analog.json \
                      --generator "python3 layout/gen/gen_osc_bank.py -o <scratch>/osc_bank.gds" \
                      --regenerated-hash "sha256:625c8ff90f34c6fac7a88339d2c10ad5925da02e118eb6a15a6539c11e05bf29" \
                      --check evidence/item2_analog.json
          klt signoff --attest 2 --input layout/readout/out/readout.gds \
                      --inventory attest/item2_digital.json \
                      --check evidence/item2_digital.json
