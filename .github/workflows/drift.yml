name: sized-request drift

# sim/solve/mc/requests-sized/ is committed because recorded yield results cite
# those files as inputs. Fail if it drifts from what gen_binding_mc.py --sized
# generates (the test generates into a temp dir; it does not touch the tree).
#
# Python 3.12 is the repo-wide floor, not a requirement of this job: this
# check's only step passes on 3.10 too (measured, issue #144). The floor is
# declared once, by `min_python` in sim/solve/test_records_reproduce.py, and
# every workflow follows it so the next full-repr float produced by sum() does
# not have to rediscover the 3.10-vs-3.12 split (gh-100425) here. The same
# test fails if any workflow is lowered below it.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sized-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check committed sized MC requests match the generator
        run: python3 -I sim/solve/test_gen_binding_mc.py
